name: Android CI

on:
  push:
    branches: [ "jules-16248539194030543503" ]
  pull_request:
    branches: [ "jules-16248539194030543503" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      working-directory: AndroidApp

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug
      working-directory: AndroidApp

    - name: Prepare APK artifact
      run: cp app/build/outputs/apk/debug/app-debug.apk IMU-velocity-and-displacement-measurements.apk
      working-directory: AndroidApp

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: IMU-velocity-and-displacement-measurements
        path: AndroidApp/IMU-velocity-and-displacement-measurements.apk
